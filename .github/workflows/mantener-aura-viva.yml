name: Mantener Aura viva

# Las instancias gratuitas de Neo4j Aura se PAUSAN despues de unos dias sin
# actividad y despues de un tiempo pausadas se BORRAN. Ya perdimos una asi
# (la instancia 8b37b6ab, creada el 12/08/2026, dejo de existir).
#
# Este workflow le manda una consulta trivial cada dos dias para que la base
# figure como activa. Va por HTTPS (Query API, puerto 443), asi que funciona
# desde cualquier lado, incluida la red de la facultad que bloquea el 7687.

on:
  schedule:
    # 12:00 UTC (09:00 en Argentina) cada dos dias. El margen es a proposito:
    # Aura pausa a los ~3 dias y los cron de GitHub a veces se atrasan.
    - cron: '0 12 */2 * *'
  workflow_dispatch:        # tambien se puede correr a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Aura por HTTPS
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
        run: |
          set -euo pipefail

          if [ -z "${NEO4J_URI:-}" ] || [ -z "${NEO4J_PASSWORD:-}" ]; then
            echo "::warning::Faltan los secrets NEO4J_*. El keep-alive no hace nada."
            echo "Cargarlos en Settings > Secrets and variables > Actions."
            exit 0
          fi

          HOST="${NEO4J_URI#*://}"      # saca el esquema neo4j+s://
          HOST="${HOST%%/*}"            # saca cualquier path
          HOST="${HOST%%:*}"            # saca el puerto si viniera
          BASE="${NEO4J_DATABASE:-neo4j}"
          URL="https://${HOST}/db/${BASE}/query/v2"

          echo "Consultando ${URL}"

          # --fail-with-body para que un 401/404 corte el job en vez de pasar
          # silencioso. La password va por -u y no se imprime nunca.
          RESPUESTA=$(curl --silent --show-error --fail-with-body --max-time 60 \
            -u "${NEO4J_USER}:${NEO4J_PASSWORD}" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -d '{"statement":"MATCH (n:Nodo) RETURN count(n) AS nodos"}' \
            "${URL}")

          echo "Respuesta: ${RESPUESTA}"

          case "${RESPUESTA}" in
            *'"errors"'*)
              echo "::error::Aura devolvio un error. Revisar credenciales o estado de la instancia."
              exit 1 ;;
          esac

          echo "Aura respondio bien: la instancia sigue activa."
