# Perfil "http": se habla con Neo4j por la Query API sobre HTTPS (puerto 443).
#
# Se activa solo cuando Bolt (7687) no esta accesible, tipicamente desde la red
# de UADE, que corta el TLS en todos los puertos que no son los conocidos.
#
# Hay que apagar el autoconfig de Neo4j: si queda prendido, Spring arma el
# driver de Bolt y la aplicacion se muere al arrancar intentando conectar por
# el 7687, que es justo lo que no funciona.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.neo4j.Neo4jAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.neo4j.Neo4jDataAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.neo4j.Neo4jRepositoriesAutoConfiguration
