spring.application.name=tpo-prog3

# --- Carga automatica del archivo .env --------------------------------------
# Con esto NO hace falta exportar las variables antes de arrancar: alcanza con
# tener el .env en la raiz del proyecto. Si no existe, no pasa nada (optional).
#
# OJO con la precedencia: por este mecanismo el .env entra como ARCHIVO, o sea
# con MENOS prioridad que las variables de entorno de la maquina. Para que el
# .env del proyecto sea el que manda, TransporteNeo4j lo sube a propiedades del
# sistema antes de arrancar Spring. Si no, una variable NEO4J_URI vieja en el
# sistema (apuntando a localhost, por ejemplo) le gana al .env sin avisar.
spring.config.import=optional:file:./.env[.properties]

# --- Transporte hacia Neo4j -------------------------------------------------
# El perfil activo lo decide TransporteNeo4j al arrancar, probando si Bolt
# (7687) esta accesible:
#   bolt -> Spring Data Neo4j sobre Bolt          (lo normal)
#   http -> Query API sobre HTTPS, puerto 443     (red de UADE: bloquea el 7687)
# Para forzarlo, poner NEO4J_TRANSPORTE=bolt o =http en el .env.

# --- Conexion a Neo4j -------------------------------------------------------
# NUNCA escribir la password aca. Se toma de variables de entorno.
# Local:  export NEO4J_URI=bolt://localhost:7687
# Aura:   export NEO4J_URI=neo4j+s://xxxxxxx.databases.neo4j.io
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USER:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:}

# Nombre de la base dentro de la instancia. En Aura NO siempre es "neo4j":
# algunas instancias usan el id de la instancia como nombre de base.
spring.data.neo4j.database=${NEO4J_DATABASE:neo4j}

# --- Carga de datos de ejemplo ---------------------------------------------
# Poner en false cuando el grupo cargue su propio dominio.
app.seed.enabled=true

# --- Logging ----------------------------------------------------------------
logging.level.uade.prog3.tpo=INFO
